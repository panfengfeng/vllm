group: LM Eval
depends_on:
  - image-build
steps:
- label: ":nvidia: (B200) DeepSeek V4.1 DSpark GSM8K"
  key: lm-eval-spec-decode-4xb200
  timeout_in_minutes: 120
  device: b200-k8s
  num_devices: 4
  optional: true
  # Preserve the existing B200 job and checkpoint thresholds. B300 has not
  # been validated; this job does not establish a B300 deployment baseline.
  source_file_dependencies:
  - .buildkite/test_areas/lm_eval.yaml
  - tests/evals/gsm8k/
  - vllm/models/deepseek_v4/
  - vllm/models/deepseek_v41/
  - vllm/model_executor/layers/dspark.py
  - vllm/v1/spec_decode/draft_attention.py
  - vllm/v1/spec_decode/metrics.py
  - vllm/v1/worker/gpu/spec_decode/adaptive_verification.py
  - vllm/v1/worker/gpu/spec_decode/dflash/
  - vllm/v1/worker/gpu/spec_decode/dspark/
  - vllm/v1/worker/gpu/spec_decode/rejection_sampler.py
  - vllm/v1/worker/gpu/spec_decode/speculator.py
  commands:
  - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=configs/models-deepseek-v41.txt
