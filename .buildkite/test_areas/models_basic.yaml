group: Models - Basic
depends_on:
  - image-build
steps:
- label: ":nvidia: (H200 MIG 18GB) Basic Models (Initialization)"
  key: basic-models-tests-initialization
  timeout_in_minutes: 25
  device: h200_18gb
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/models/test_initialization.py
  - tests/models/registry.py
  commands:
    # Run a subset of model initialization tests
    - pytest -v -s models/test_initialization.py::test_can_initialize_small_subset
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Basic Models (Initialization)"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 30
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 35GB) Basic Models (Extra Initialization) Shard %N"
  device: h200_35gb
  key: basic-models-tests-extra-initialization
  timeout_in_minutes: 30
  source_file_dependencies:
  - vllm/model_executor/models/
  - tests/models/test_initialization.py
  - tests/models/registry.py
  commands:
    # Only when vLLM model source is modified - test initialization of a large
    # subset of supported models (the complement of the small subset in the above
    # test.) Also run if model initialization test file is modified
    - pytest -v -s models/test_initialization.py -k 'not test_can_initialize_small_subset' --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT --shard-id=$$BUILDKITE_PARALLEL_JOB
  parallelism: 14
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Basic Models (Extra Initialization) Shard %N"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 60
      parallelism: 10
      working_dir: "/vllm-workspace/tests"
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/model_executor/models/
      - vllm/model_executor/layers/
      - tests/models/test_initialization.py
      - tests/models/registry.py
      - vllm/_aiter_ops.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (H200 MIG 35GB) Basic Models (Other)"
  device: h200_35gb
  key: basic-models-tests-other
  timeout_in_minutes: 38
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/models/test_terratorch.py
  - tests/models/test_registry.py
  - tests/models/test_deepseek_v4_vl_rocm.py
  - tests/models/test_deepseek_v41_decoder_replay_layers.py
  - tests/models/test_deepseek_v41_replay_batch.py
  - tests/models/test_deepseek_v41_replay_start.py
  commands:
    - pytest -v -s models/test_terratorch.py models/test_registry.py models/test_deepseek_v4_vl_rocm.py models/test_deepseek_v41_replay_start.py models/test_deepseek_v41_decoder_replay_layers.py models/test_deepseek_v41_replay_batch.py
  mirror:
    amd:
      label: ":amd: (MI355) Basic Models (Other)"
      dind: false
      device: mi355_1
      timeout_in_minutes: 65
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/models/deepseek_v4/
      - tests/models/test_deepseek_v4_vl_rocm.py
      - tests/models/test_hyv4_rocm.py
      - tests/models/test_deepseek_v41_replay_start.py
      - tests/models/test_deepseek_v41_decoder_replay_layers.py
      - tests/models/test_deepseek_v41_replay_batch.py
      - tests/models/test_deepseek_v4_rocm_wo_a.py
      - tests/models/test_deepseek_v4_rocm_compressor_gemm_fusion.py
      commands:
      - pytest -v -s models/test_terratorch.py models/test_registry.py models/test_deepseek_v4_vl_rocm.py models/test_deepseek_v41_replay_start.py models/test_deepseek_v41_decoder_replay_layers.py models/test_deepseek_v41_replay_batch.py models/test_deepseek_v4_rocm_wo_a.py models/test_deepseek_v4_rocm_compressor_gemm_fusion.py
      - VLLM_ROCM_USE_AITER=1 pytest -v -s models/test_hyv4_rocm.py -m 'not distributed'

- label: ":nvidia: (B200) Inkling"
  key: inkling-unit-tests-b200
  timeout_in_minutes: 40
  device: b200-k8s
  source_file_dependencies:
  - vllm/models/inkling/
  - vllm/cute_utils/
  - cmake/external_projects/tml_fa4.cmake
  - tests/models/inkling/
  commands:
    # FA4 kernel tests require SM100; the suite skips them elsewhere.
    - pytest -v -s models/inkling
  mirror:
    amd:
      label: ":amd: (MI355) Inkling"
      dind: false
      device: mi355_1
      timeout_in_minutes: 65
      working_dir: "/vllm-workspace/tests"
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/models/inkling/
      - vllm/cute_utils/
      - cmake/external_projects/tml_fa4.cmake
      - tests/models/inkling/
      - vllm/platforms/rocm.py
      commands:
      - pytest -v -s models/inkling/rocm

- label: ":computer: (CPU) Basic Models Other"
  key: basic-models-test-other-cpu
  depends_on:
  - image-build-cpu
  timeout_in_minutes: 30
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/models/test_utils.py
  - tests/models/test_vision.py
  - tests/models/test_adapters.py
  - tests/model_executor/layers/test_activation.py
  - tests/models/test_language_model_cache_is_weak.py
  - tests/models/test_deepseek_v4_fi_moe_ep.py
  - tests/models/test_dspark_mla.py
  device: cpu-small
  commands:
    - pytest -v -s models/test_utils.py models/test_vision.py models/test_adapters.py model_executor/layers/test_activation.py models/test_language_model_cache_is_weak.py models/test_deepseek_v4_fi_moe_ep.py models/test_dspark_mla.py
